<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Sistema de Monitoramento Ambiental</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<main class="auth-container">
  <!-- BOTÃO VOLTAR AO MAPA -->
  <div style="margin-bottom: 16px; text-align: left;">
    <a href="index.html" class="back-link">
      <i class="bi bi-arrow-left-short" style="font-size: 1.2rem;"></i> Voltar ao Mapa
    </a>
  </div>

  <div class="auth-header">
    <h1><i class="bi bi-person-plus-fill" style="color:var(--accent);"></i> Criar Conta <span class="badge" style="background:var(--accent); color:#06121a; font-size:0.65rem; padding:3px 8px; border-radius:4px; font-weight:700;">Cidadão</span></h1>
    <p>Participe do mapeamento colaborativo de ocorrências</p>
  </div>

  <div class="auth-card">
    <form id="register-form" action="/api/auth/register.php" method="POST" novalidate>
      <input type="hidden" name="csrf_token" id="csrf_token" value="">

      <div class="form-group">
        <label for="name"><i class="bi bi-person-fill"></i> Nome completo</label>
        <input type="text" id="name" name="name" placeholder="Ex: Maria Silva" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="email"><i class="bi bi-envelope-fill"></i> E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required autocomplete="email">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password"><i class="bi bi-lock-fill"></i> Senha</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirm_password"><i class="bi bi-check2-circle"></i> Confirmar</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Repita a senha" required autocomplete="new-password">
        </div>
      </div>

      <div class="pwd-tracker">
        Força da senha
        <div class="pwd-meter"><div id="pwd-bar" class="pwd-meter-bar"></div></div>
      </div>

      <button type="submit" id="submit-btn" style="margin-top: 20px;"><i class="bi bi-person-check-fill"></i> Finalizar Cadastro</button>
    </form>
  </div>

  <div class="auth-footer">
    Já tem uma conta cadastrada? <a href="login.html">Faça seu login</a>
  </div>
</main>

<script>
  const passwordInput = document.getElementById('password');
  const pwdBar = document.getElementById('pwd-bar');

  passwordInput.addEventListener('input', () => {
    const val = passwordInput.value;
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const pct = (score / 4) * 100;
    pwdBar.style.width = pct + '%';

    if (score <= 1) pwdBar.style.backgroundColor = 'var(--talude)';
    else if (score <= 3) pwdBar.style.backgroundColor = 'var(--erosao)';
    else pwdBar.style.backgroundColor = '#22c55e';
  });
</script>
</body>
</html>
