<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistema de Monitoramento Ambiental</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<main class="auth-container">
  <!-- BOTÃO VOLTAR AO MAPA -->
  <div style="margin-bottom: 16px; text-align: left;">
    <a href="index.html" class="back-link">
      <i class="bi bi-arrow-left-short" style="font-size: 1.2rem;"></i> Voltar ao Mapa
    </a>
  </div>

  <div class="auth-header">
    <h1><i class="bi bi-shield-lock-fill" style="color:var(--accent);"></i> Monitoramento <span class="badge" style="background:var(--accent); color:#06121a; font-size:0.65rem; padding:3px 8px; border-radius:4px; font-weight:700;">SP</span></h1>
    <p>Acesse sua conta para sinalizar ocorrências</p>
  </div>

  <div class="auth-card">
    <div id="auth-alert" class="alert-message"></div>

    <form id="login-form" action="/api/auth/login.php" method="POST" novalidate>
      <input type="hidden" name="csrf_token" id="csrf_token" value="">

      <div class="form-group">
        <label for="email"><i class="bi bi-envelope-fill"></i> E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password"><i class="bi bi-key-fill"></i> Senha</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-password" id="toggle-pwd-btn" aria-label="Mostrar ou ocultar senha">
            <i class="bi bi-eye" id="toggle-icon"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submit-btn"><i class="bi bi-box-arrow-in-right"></i> Entrar no Sistema</button>
    </form>
  </div>

  <div class="auth-footer">
    Não possui uma conta? <a href="register.html">Cadastre-se gratuitamente</a>
  </div>
</main>

<script>
  const pwdInput = document.getElementById('password');
  const toggleBtn = document.getElementById('toggle-pwd-btn');
  const toggleIcon = document.getElementById('toggle-icon');
  
  toggleBtn.addEventListener('click', () => {
    const isPassword = pwdInput.type === 'password';
    pwdInput.type = isPassword ? 'text' : 'password';
    toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
  });
</script>
</body>
</html>
